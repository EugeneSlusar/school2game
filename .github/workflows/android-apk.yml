name: Android APK

# Автозапуск на push отключён: Android на паузе, сборка не проверена и падала письмами на почту.
# Запускать вручную: GitHub → Actions → Android APK → Run workflow. Чтобы вернуть автосборку, верни блок push.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tablichny-sport-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
