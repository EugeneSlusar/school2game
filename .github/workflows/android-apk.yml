name: Android APK

# Автозапуск на push отключён: Android на паузе, сборка не проверена и падала письмами на почту.
# Запускать вручную: GitHub → Actions → Android APK → Run workflow. Чтобы вернуть автосборку, верни блок push.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK уже стоит на образе ubuntu-latest (ANDROID_HOME). Шаг android-actions/setup-android на новых образах падает
      # («Failed to find package 'tools'»), он не нужен. Лицензии принимаем сами, чтобы Gradle мог докачать недостающее.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tablichny-sport-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
